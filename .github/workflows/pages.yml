# Builds the website and publishes it on GitHub Pages every time `main` is pushed.
# Address: https://jayashri1107.github.io/Photography-Studio/
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
        working-directory: client
      - name: Build
        run: npm run build
        working-directory: client
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_NO_API: '1'
      # Pages has no server-side routing: serving the app for unknown paths lets /about, /portfolio … open directly.
      - name: Page links fallback
        run: cp client/dist/index.html client/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
